name: holdout_evaluation
data:
  symbols: [BTCUSDT, ETHUSDT, BNBUSDT]
  interval: 6h
  start: "2024-01-01"
  end: "2026-01-01"
  cache_dir: data/cache
portfolio:
  initial_capital: 10000.0
  gross_limit: 100000.0
  leverage_limit: 10.0
strategies:
  mean_reversion:
    window: 40
    z_threshold: 1.0
  trend_following:
    fast_window: 8
    slow_window: 32
costs:
  low: 0.5
  baseline: 1.0
  high: 1.5
evaluation:
  development:
    start: "2024-01-01"
    end: "2025-01-01"
  holdout:
    start: "2025-01-01"
    end: "2026-01-01"
output_dir: artifacts/holdout_evaluation
