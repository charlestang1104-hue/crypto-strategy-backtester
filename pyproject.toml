[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-strategy-backtester"
version = "1.0.0"
description = "A reproducible, cost-aware research backtester for systematic crypto strategies."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Qianfeng Tang" },
]
keywords = ["backtesting", "quantitative-finance", "cryptocurrency", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15,<24",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "reportlab>=4,<5",
  "ruff>=0.9,<1",
]
notebook = [
  "jupyterlab>=4,<5",
]
report = [
  "reportlab>=4,<5",
]

[project.scripts]
crypto-backtester = "crypto_backtester.cli:main"

[project.urls]
Homepage = "https://github.com/charlestang1104-hue/crypto-strategy-backtester"
Repository = "https://github.com/charlestang1104-hue/crypto-strategy-backtester"
Issues = "https://github.com/charlestang1104-hue/crypto-strategy-backtester/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501"]
"scripts/build_report.py" = ["E501"]
